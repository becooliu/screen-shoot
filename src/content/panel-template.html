<div id="extension-panel-template">
  <style>
    #extension-panel-template {
        width: 300px;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
        color: white;
        min-height: 350px;
    }

    .container {
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 1.5rem;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 25px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
    }

    .btn.primary {
        background-color: #4CAF50;
        color: white;
    }

    .btn.primary:hover {
        background-color: #45a049;
        transform: translateY(-2px);
    }

    .btn.secondary {
        background-color: #2196F3;
        color: white;
    }

    .btn.secondary:hover {
        background-color: #0b7dda;
        transform: translateY(-2px);
    }

    .instructions {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .instructions h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 1.1rem;
    }

    .instructions ol {
        padding-left: 20px;
        margin: 0;
    }

    .instructions li {
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .status {
        text-align: center;
        padding: 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
    }

    #statusText {
        margin: 0;
        font-weight: 500;
        color: #FFD700;
    }
  </style>

  <div class="container">
    <h1>区域截图</h1>
    <div class="buttons">
      <button id="getAndSavePosition" class="btn primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M17 5.33C17 3.5 15.5 2 13.67 2H5.33C3.5 2 2 3.5 2 5.33v13.34C2 20.5 3.5 22 5.33 22h8.34c1.83 0 3.33-1.5 3.33-3.33V5.33zM8 18H6v-2h2v2zm0-4H6v-2h2v2zm0-4H6V8h2v2zm6 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V8h4v2z" />
        </svg>
        选择区域
      </button>
      <button id="capture" class="btn secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z" />
        </svg>
        截图
      </button>
    </div>
    <div class="instructions">
      <h3>如何使用</h3>
      <ol>
        <li>点击"选择区域"按钮，并用鼠标在页面选择需要截图的区域</li>
        <li>所框选的区域坐标将自动保存，文件名可在保存前自定义</li>
        <li>点击"截图"按钮可使用之前保存的配置，自动截取指定区域的图片</li>
      </ol>
    </div>
    <div class="status">
      <p id="statusText">准备好选择要截图的区域</p>
    </div>
  </div>
  </div>
