<div id="extension-panel-template">
  <style>
    
    #extension-panel-template {
        width: 300px;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: rgba(238, 238, 238, 0.8);
        color: #000;
        min-height: 100vh;
        height: 100vh;
    }

    .container {
        padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 5px;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-bottom: 25px;
    }

    .close-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #aaa;
    }
    .close-panel:hover {
      background-color: #ccc;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
        font-weight: normal;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn.primary {
        background-color: #4CAF50;
    }

    .btn.primary:hover {
        background-color: #45a049;
    }

    .btn.secondary {
        background-color: #2196F3;
    }

    .btn.secondary:hover {
        background-color: #0b7dda;
    }
    .btn.secondary.not-allowed {
        background-color: #ccc;
        cursor: not-allowed;
    }

    .instructions {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .instructions h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 1.1rem;
    }

    .instructions ol {
        padding-left: 20px;
        margin: 0;
    }

    .instructions li {
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .status {
        text-align: center;
        padding: 10px 5;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
    }
    .status #status-text {
      font-size: 14px;
    }
    .status .info {
      color:#45a049
    }
    .status .error {
      color: #f00
    }
  </style>

  <div class="container">
<header>
  <button class="close-panel" id="close-panel" title="close panel">X</button>
</header>
    <div class="buttons">
      <button id="getAndSavePosition" class="btn primary">
        选择截图区域
      </button>
      <button id="capture" class="btn secondary">
        使用配置截图
      </button>
    </div>
    <hr />
    <div class="buttons">
      <label for="input-mobile" id="switch-to-mobile">
        <input type="radio" id="input-mobile" name="switch-device">
        <span>切换到移动端</span>
      </label>
      <label for="input-desktop" id="switch-to-desktop">
        <input type="radio" id="input-desktop" name="switch-device">
        <span>切换到 PC端</span>
      </label>
      <!-- <button class="btn primary" id="switch-to-mobile">切换到移动端</button>
                      <button class="btn primary" id="switch-to-desktop">切换到 PC端</button> -->
    </div>
    <div class="instructions">
      <h3>如何使用</h3>
      <ol>
        <li>点击"选择区域"按钮，并用鼠标在页面选择需要截图的区域</li>
        <li>所框选的区域坐标将自动保存，文件名可在保存前自定义</li>
        <li>点击"截图"按钮可使用之前保存的配置，自动截取指定区域的图片</li>
      </ol>
    </div>
    <div class="status">
      <p id="status-text">准备好选择要截图的区域</p>
    </div>
  </div>
  </div>
